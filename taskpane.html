<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>EXAI ChatGPT</title><script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script><style>body{font-family:"Segoe UI",Tahoma,sans-serif;margin:0;padding:16px;background:#f8f9fa;color:#333}h2{color:#1a73e8;font-size:18px;margin:0 0 4px 0}.sub{font-size:12px;color:#666;margin-bottom:14px;line-height:1.4}label{font-weight:600;display:block;margin-bottom:6px;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:13px;margin-bottom:10px;background:#fff}textarea{resize:vertical;min-height:120px;font-family:"Segoe UI",Tahoma,sans-serif}button{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}.btn-run{background:#1a73e8;color:#fff}.btn-run:hover{background:#1557b0}.btn-run:disabled{background:#9ac0f5;cursor:not-allowed}.btn-clear{background:#e8eaed;color:#333}.status{font-size:13px;padding:10px;border-radius:8px;margin-top:10px;display:none;white-space:pre-wrap;line-height:1.45}.status.success{background:#e6f4ea;color:#137333;display:block}.status.error{background:#fce8e6;color:#c5221f;display:block}.status.loading{background:#e8f0fe;color:#1a73e8;display:block}.hint{font-size:12px;color:#666;margin:-4px 0 12px 0;line-height:1.35}.small{font-size:11px;color:#777;line-height:1.35;margin-top:-6px;margin-bottom:10px}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body><h2>⚡ EXAI ChatGPT</h2><div class="sub">Trợ lý AI cho Excel/Word dùng OpenAI hoặc API tương thích OpenAI.</div><label>OpenAI API Key:</label> <input type="password" id="api_key_input" placeholder="Nhập API key, ví dụ sk-..."/> <label>API URL:</label> <input id="api_url_input" placeholder="https://api.openai.com/v1/chat/completions"/><div class="small">Mặc định dùng OpenAI. Nếu dùng proxy/API tương thích OpenAI thì thay URL tại đây.</div><label>Model:</label> <select id="model_select"><option value="gpt-4o-mini">gpt-4o-mini - nhanh, rẻ, dùng tốt cho Excel</option><option value="gpt-4o">gpt-4o - mạnh hơn</option><option value="gpt-4.1-mini">gpt-4.1-mini - code tốt, chi phí vừa</option><option value="gpt-4.1">gpt-4.1 - mạnh hơn cho code/phân tích</option></select> <label>Nhập yêu cầu:</label> <textarea id="prompt_input" placeholder="VD: Tính tổng vùng bôi đen điền vào ô P33
VD: Lọc giá trị không trùng từ cột D sang cột F
VD: Tô màu đỏ các ô có giá trị > 100
VD: Sắp xếp vùng đang chọn tăng dần
VD: Đổi font Times New Roman cỡ 13 vùng bôi đen
VD: Giải thích hàm VLOOKUP
VD: Viết đoạn giới thiệu công ty trong Word"></textarea><div class="hint">💡 Nên bôi đen vùng dữ liệu trước khi ra lệnh. Với dữ liệu đã bôi đen, AI sẽ đọc trực tiếp vùng đó để xử lý chính xác hơn.</div><button class="btn-run" id="run_button">▶️ Thực thi</button> <button class="btn-clear" id="clear_button">🗑️ Xóa yêu cầu</button><div class="status" id="status_area"></div><script src="706db8657e828ace3a2d.js"></script></body></html>
