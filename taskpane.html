<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>EXAI Pro</title><script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script><style>body{font-family:'Segoe UI',sans-serif;margin:0;padding:16px;background:#f8f9fa;color:#333}h2{color:#1a73e8;font-size:18px;margin:0 0 4px 0}.sub{font-size:11px;color:#888;margin-bottom:16px}label{font-weight:600;display:block;margin-bottom:6px;font-size:14px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:14px;margin-bottom:12px}textarea{resize:vertical;min-height:100px}button{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}.btn-run{background:#1a73e8;color:#fff}.btn-run:hover{background:#1557b0}.btn-run:disabled{background:#9ac0f5;cursor:not-allowed}.btn-clear{background:#e8eaed;color:#333}.status{font-size:13px;padding:10px;border-radius:8px;margin-top:10px;display:none;white-space:pre-wrap}.status.success{background:#e6f4ea;color:#137333;display:block}.status.error{background:#fce8e6;color:#c5221f;display:block}.status.loading{background:#e8f0fe;color:#1a73e8;display:block}.hint{font-size:12px;color:#666;margin:-6px 0 12px 0}</style><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body><h2>⚡ EXAI Pro</h2><div class="sub">Trợ lý Excel thông minh - Gemini</div><label>Gemini API Key:</label> <input type="password" id="api_key_input" placeholder="Nhập API key (1 lần)"/> <label>Model:</label> <select id="model_select"><option value="gemini-3.5-flash">Gemini 3.5 Flash (Khuyên dùng)</option><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Nhanh)</option><option value="gemini-2.5-pro">Gemini 2.5 Pro (Mạnh nhất)</option></select> <label>Nhập yêu cầu:</label> <textarea id="pro
